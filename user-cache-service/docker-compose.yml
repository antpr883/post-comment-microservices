version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: user-cache-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - user-cache-network
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: user-cache-postgres
    environment:
      POSTGRES_DB: user_snapshot
      POSTGRES_USER: snap_user
      POSTGRES_PASSWORD: 1234
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - user-cache-network
    restart: unless-stopped

volumes:
  redis_data:
  postgres_data:

networks:
  user-cache-network:
    driver: bridge 