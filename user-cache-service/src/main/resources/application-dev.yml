# Development Configuration for User Cache Service

spring:
  # ========== SNAPSHOT DATABASE ==========
  snapshot-datasource:
    url: jdbc:postgresql://localhost:5432/user_snapshot?ssl=false
    driver-class-name: org.postgresql.Driver
    username: snap_user
    password: 1234
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000

  # ========== REDIS ==========
  redis:
    host: localhost
    port: 6379
    password: 
    database: 0
    timeout: 2000ms
    lettuce:
      pool:
        max-active: 8
        min-idle: 0

# ========== USER CACHE SERVICE CONFIGURATION ==========
user-cache:
  enabled: true
  cleanup:
    cron: 0 0 2 * * ?
    batch-size: 100

cache:
  redis:
    key-prefix: "user:"
    ttl: PT30M
  database:
    ttl: PT6H
  user-service:
    base-url: http://localhost:8082

# ========== LOGGING ==========
logging:
  level:
    com.andev.cache: DEBUG
    org.springframework.data.redis: DEBUG
    org.springframework.jdbc: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n" 