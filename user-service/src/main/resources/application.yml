spring:
  application:
    name: user-service
  
  profiles:
    active: dev
  
  main:
    allow-bean-definition-overriding: true
    allow-circular-references: true

  config:
    import:
      - classpath:api.properties

# Application specific configuration
app:
  logging:
    include-stack-trace: false  # Set to true in dev environment for debugging
    max-stack-trace-elements: 10
  
  performance:
    slow-operation-threshold: 1000  # milliseconds
    
  validation:
    max-username-length: 50
    max-email-length: 100
    max-batch-size: 100
    
  security:
    password-min-length: 8
    password-max-length: 128

# SpringDoc OpenAPI Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    doc-expansion: none
    disable-swagger-default-url: true
    display-request-duration: true
    config-url: /v3/api-docs/swagger-config
    url: /v3/api-docs
  packages-to-scan: com.andev.user.web
  paths-to-match: /api/v1/**

