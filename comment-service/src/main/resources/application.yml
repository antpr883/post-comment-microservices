spring:
  application:
    name: comment-service
  
  profiles:
    active: dev
  
  main:
    allow-bean-definition-overriding: true
    allow-circular-references: true

  config:
    import:
      - classpath:api.properties

  # Liquibase Configuration for MongoDB
  liquibase:
    enabled: false  # Disable Liquibase for now - MongoDB doesn't use standard Liquibase
    change-log: classpath:db/changelog/db.changelog-master.xml
    contexts: dev

# User Cache Service Configuration
user-cache:
  enabled: true
  database:
    url: jdbc:postgresql://localhost:5432/user_snapshot
    username: snap_user
    password: 1234
    driver-class-name: org.postgresql.Driver
    max-pool-size: 5
    min-idle: 1
    connection-timeout: 10000
    ttl: PT6H
  redis:
    host: localhost
    port: 6379
    password: ""
    database: 0
    key-prefix: "comment_user:"
    ttl: PT30M
  user-service:
    base-url: http://localhost:8081

# OpenAPI/Swagger Documentation
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operationsSorter: method
    tagsSorter: alpha
    displayRequestDuration: true
    displayOperationId: false
  show-actuator: true 